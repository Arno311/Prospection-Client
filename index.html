<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Prospection — Atelier Piano Léman</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<style>
  :root{ color-scheme:dark;
    --bg:#090b10; --s1:#10131a; --s2:#161a23; --s3:#1e232e; --line:#242a37; --line2:#313848;
    --ink:#eef1f7; --muted:#8c95a8; --dim:#5f6879;
    --accent:#6ea8ff; --accent-ink:#06101f; --accent-soft:rgba(110,168,255,.14);
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --shadow:0 12px 34px rgba(0,0,0,.4); }
  @media (prefers-color-scheme:light){
    :root[data-theme=auto]{ color-scheme:light;
      --bg:#f2f4f8; --s1:#fff; --s2:#f7f8fb; --s3:#eceff5; --line:#e2e6ee; --line2:#cfd5e1;
      --ink:#11151d; --muted:#5b6478; --dim:#8c95a8;
      --accent:#2563eb; --accent-ink:#fff; --accent-soft:rgba(37,99,235,.10);
      --ok:#059669; --warn:#b45309; --bad:#dc2626; --shadow:0 12px 30px rgba(20,30,60,.12); } }
  :root[data-theme=light]{ color-scheme:light;
      --bg:#f2f4f8; --s1:#fff; --s2:#f7f8fb; --s3:#eceff5; --line:#e2e6ee; --line2:#cfd5e1;
      --ink:#11151d; --muted:#5b6478; --dim:#8c95a8;
      --accent:#2563eb; --accent-ink:#fff; --accent-soft:rgba(37,99,235,.10);
      --ok:#059669; --warn:#b45309; --bad:#dc2626; --shadow:0 12px 30px rgba(20,30,60,.12); }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer}
  button:active{transform:scale(.98)}
  h2,h3{margin:0}

  /* ——— barre du haut ——— */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-size:18px;font-weight:700}
  .brand .t{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.2}
  .brand .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
  .s .stale{background:var(--warn)}
  .acts{display:flex;gap:6px;flex:none}
  .icon{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--s1);
    display:grid;place-items:center;font-size:17px;color:var(--muted)}
  .icon:hover{color:var(--ink);border-color:var(--line2)}
  .icon.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 90px}

  /* ——— tableau de bord ——— */
  .dash{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:10px}
  .tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 15px;min-width:0}
  .tile .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
  .tile .n{font-size:12px;color:var(--muted);margin-top:1px}
  .tile.goal{display:flex;align-items:center;gap:13px}
  .ring{width:62px;height:62px;flex:none;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{stroke:var(--s3)} .ring .fg{stroke:var(--accent);transition:stroke-dasharray .5s}
  .ring.full .fg{stroke:var(--ok)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700}
  .tile.click{cursor:pointer;text-align:left;transition:border-color .15s}
  .tile.click:hover{border-color:var(--line2)}
  .tile.click.on{border-color:var(--accent);background:var(--accent-soft)}
  .pipe{margin-top:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
  .pipe .bar{display:flex;height:9px;border-radius:9px;overflow:hidden;background:var(--s3);gap:2px}
  .pipe .bar i{display:block;height:100%;min-width:3px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend em{width:8px;height:8px;border-radius:50%;display:inline-block}
  .legend b{color:var(--ink);font-weight:650}

  .cta{width:100%;margin-top:12px;min-height:54px;border:0;border-radius:15px;font-weight:700;font-size:16px;
    background:linear-gradient(135deg,var(--accent),#7c8cff);color:var(--accent-ink);
    box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
  .cta small{font-weight:600;opacity:.75;margin-left:6px}
  .cta:disabled{opacity:.45;box-shadow:none;cursor:default}

  /* ——— outils ——— */
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;
    color:var(--muted);min-height:36px}
  .seg button.on{background:var(--s3);color:var(--ink)}
  .ghost{border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:8px 13px;min-height:42px;
    font-size:13.5px;font-weight:600;color:var(--muted)}
  .ghost:hover{color:var(--ink);border-color:var(--line2)}
  #q{width:100%;margin-top:10px;font:inherit;font-size:16px;padding:11px 14px;min-height:46px;color:var(--ink);
    border:1px solid var(--line);border-radius:13px;background:var(--s1);outline:none}
  #q::placeholder{color:var(--dim)}
  #q:focus,.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;gap:7px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--muted);border-radius:30px;
    padding:6px 13px;min-height:36px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .chip small{font-weight:650;opacity:.7}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .sec{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700;margin:24px 2px 10px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .sec b{color:var(--ink)}

  /* ——— fiches ——— */
  .card{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--st,var(--line2));
    border-radius:14px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
  .card:hover{border-color:var(--line2);border-left-color:var(--st)}
  .head{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;user-select:none}
  .who{flex:1;min-width:0}
  .nm{font-weight:650;font-size:15px;line-height:1.35}
  .mt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;flex:none;white-space:nowrap}
  .badge{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;flex:none;white-space:nowrap;
    background:var(--s3);color:var(--muted)}
  .badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .chev{color:var(--dim);font-size:11px;flex:none;transition:transform .2s}
  .card.open .chev{transform:rotate(90deg)}
  .body{display:none;padding:2px 14px 14px;border-top:1px solid var(--line)}
  .card.open .body{display:block}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:650;margin:14px 0 5px}
  .val{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-word}
  .val a{color:var(--accent);text-decoration:none}
  pre.txt{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;
    white-space:pre-wrap;font:14.5px/1.65 inherit;outline:none;word-break:break-word;color:var(--ink)}
  pre.txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  mark{background:color-mix(in srgb,var(--warn) 26%,transparent);color:inherit;padding:1px 2px;border-radius:4px}
  .flag{margin-top:12px;font-size:13px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
    background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:11px;padding:9px 12px}
  .btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
  .btns button{flex:1 1 auto;min-width:130px;min-height:44px;border-radius:11px;border:1px solid var(--line2);
    background:var(--s2);font-size:14px;font-weight:600;padding:9px 13px}
  .btns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btns button.done{background:var(--ok)!important;border-color:var(--ok)!important;color:#04150d!important}
  .btns button.soft{color:var(--muted)}

  .msg{padding:34px 4px;color:var(--muted);font-size:14px;text-align:center}
  .err{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);
    color:var(--ink);border-radius:14px;padding:16px;font-size:14px;line-height:1.65}
  .err ol{margin:10px 0 0;padding-left:22px} .err li{margin:5px 0}
  footer{margin-top:34px;font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:16px}
  a{color:var(--accent)}

  /* ——— session ——— */
  .sess{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
  .sess-top{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
    border-bottom:1px solid var(--line)}
  .prog{flex:1;min-width:0}
  .prog .bar{height:6px;border-radius:6px;background:var(--s3);overflow:hidden}
  .prog .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .prog span{display:block;font-size:12px;color:var(--muted);margin-top:5px}
  .sess-main{flex:1;overflow:auto;padding:18px 16px 24px;max-width:760px;width:100%;margin:0 auto}
  .sess-main h2{font-size:24px;letter-spacing:-.02em;line-height:1.25;margin:6px 0 8px}
  .sess-cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
  .sess-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sess-bar{display:flex;gap:8px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--s1)}
  .sess-bar button{flex:1;min-height:50px;border-radius:13px;border:1px solid var(--line2);background:var(--s2);
    font-weight:650;font-size:15px}
  .sess-bar button.go{flex:2;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .end{text-align:center;padding:60px 10px}
  .end .big{font-size:54px}

  /* ——— réglages ——— */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(3,6,12,.55)}
  .panel{width:min(440px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);
    overflow:auto;padding:18px 18px 40px;box-shadow:var(--shadow)}
  .panel h2{font-size:19px;margin-bottom:4px}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 6px}
  .group{margin-top:20px}
  .group>.gt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700;margin-bottom:8px}
  .field{display:block;margin-bottom:11px}
  .field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--s1);
    border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px;outline:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;font-size:14px}
  .row small{display:block;color:var(--muted);font-size:12px}
  .sw{position:relative;width:44px;height:26px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;border-radius:26px;background:var(--s3);border:1px solid var(--line2);transition:.15s}
  .sw i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
  .sw input:checked+i{background:var(--accent);border-color:var(--accent)}
  .sw input:checked+i::after{left:20px;background:#fff}
  .danger{width:100%;min-height:46px;border-radius:12px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);
    background:none;color:var(--bad);font-weight:650;margin-top:6px}

  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
    background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;gap:12px;align-items:center;
    font-size:14px;font-weight:550;max-width:min(560px,calc(100% - 24px));box-shadow:var(--shadow)}
  .toast button{border:0;background:none;color:var(--accent);font-weight:700;white-space:nowrap;padding:4px 2px}
  :root[data-theme=dark] .toast button,:root[data-theme=auto] .toast button{filter:brightness(.6) saturate(1.4)}
  :root[data-theme=light] .toast button{filter:none}

  @media (max-width:760px){
    .dash{grid-template-columns:1fr 1fr}
    .tile.goal{grid-column:1 / -1}
    .tile .v{font-size:25px}
    .btns button{flex:1 1 100%}
    .pill{display:none}
    .sess-main h2{font-size:21px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">♪</div>
    <div><div class="t">Prospection</div><div class="s" id="horo">Lecture de la feuille…</div></div>
  </div>
  <div class="acts">
    <button class="icon" id="b-refresh" aria-label="Actualiser" title="Actualiser">↻</button>
    <button class="icon" id="b-sheet" aria-label="Ouvrir la feuille Google" title="Ouvrir la feuille">▦</button>
    <button class="icon" id="b-cfg" aria-label="Réglages" title="Réglages">⚙</button>
  </div>
</header>

<main class="wrap">
  <section class="dash" id="dash"></section>
  <div class="pipe" id="pipe" hidden></div>
  <button class="cta" id="b-session" disabled>▶ Lancer une session</button>

  <div class="tools">
    <div class="seg" id="seg-vue">
      <button data-v="liste" class="on">Liste</button>
      <button data-v="relances">Relances</button>
    </div>
    <div class="seg" id="seg-etat">
      <button id="f-todo" class="on">À traiter</button>
      <button id="f-all">Tout</button>
    </div>
    <button class="ghost" id="f-group">Classé par : catégorie</button>
  </div>
  <input id="q" type="search" placeholder="Rechercher : nom, ville, e-mail, catégorie…"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div id="cats" class="chips"></div>

  <div id="out"><div class="msg">Lecture de la feuille…</div></div>

  <footer>
    L'état des contacts se modifie dans Google Sheets : l'app le relit à chaque ouverture.
    Ton suivi du jour (mails préparés, « plus tard ») reste sur cet appareil.
  </footer>
</main>

<div id="sess" class="sess" hidden></div>
<div id="cfg" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ═══════════════ Données ═══════════════ */
const FILE_ID   = "14t2kxCWcNFCVLp8YmYTNqoWSov9N7tMHnORBNQFShvs";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + FILE_ID + "/edit";
// Export CSV brut de « Feuille 1 » (gid 0) : contrairement à gviz, pas de
// conversion de type par colonne qui viderait des cellules.
const CSV_URL   = "https://docs.google.com/spreadsheets/d/" + FILE_ID + "/export?format=csv&gid=0";
const CACHE_KEY = "prospection.derniere-lecture";
const CFG_KEY   = "prospection.reglages";
const LOG_KEY   = "prospection.suivi";

const ETATS = {           // [couleur, libellé court]
  "À contacter":"#3b82f6", "Mail envoyé":"#8b5cf6", "Relancé":"#d97706",
  "RDV":"#10b981", "Pas de réponse":"#64748b", "Ne pas contacter":"#ef4444", "":"#64748b" };
const ORDRE_ETAT = ["À contacter","Pas de réponse","Mail envoyé","Relancé","RDV","Ne pas contacter"];
const ORDRE_CAT  = ["École scolaire","École de musique","Hôtel","Conciergerie","Assurance",
                    "Événementiel","Salle / Culture","Navigation","Institution","Revendeur"];
const rangEtat = e => { const i=ORDRE_ETAT.indexOf(e||""); return i<0?99:i; };
const rangCat  = k => { const i=ORDRE_CAT.indexOf(k||""); return k?(i<0?50:i):99; };
const couleur  = e => ETATS[e] || ETATS[""];

/* ═══════════════ Réglages et suivi (stockés sur l'appareil) ═══════════════ */
const DEFAUT = { nom:"Arnaud Cormary", tel:"076 221 40 89", fin:"Bien cordialement,",
  objectif:10, relanceJ:7, theme:"auto", sansMail:false, revendeurs:false,
  catsOff:[], filtre:"todo", groupe:"cat" };
let cfg = Object.assign({}, DEFAUT), LOG = {};
try{ cfg = Object.assign({}, DEFAUT, JSON.parse(localStorage.getItem(CFG_KEY)||"{}")); }catch(_){}
try{ LOG = JSON.parse(localStorage.getItem(LOG_KEY)||"{}") || {}; }catch(_){ LOG = {}; }
const saveCfg = () => { try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(_){} };
const saveLog = () => { try{ localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); }catch(_){} };
function appliquerTheme(){
  document.documentElement.dataset.theme = cfg.theme;
  document.querySelector('meta[name=theme-color]').content =
    cfg.theme==="light" || (cfg.theme==="auto" && matchMedia("(prefers-color-scheme: light)").matches) ? "#f2f4f8" : "#090b10";
}

/* ═══════════════ Utilitaires ═══════════════ */
const norm = s => (s||"").toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const esc = s => (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);
const heure = d => d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
const jour  = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const SIG = () => cfg.fin;
const TEL = () => cfg.tel;

/* ═══════════════ Textes des mails ═══════════════
   Ton : simple, chaleureux, d'égal à égal. Je me présente comme un partenaire
   qui accompagne la musique, pas comme un prestataire qui démarche. */

const intro = () => `Bonjour,

Je suis ${cfg.nom}, accordeur et facteur de piano à l'Atelier Piano Léman, à Le Vaud, sur la Côte.`;

// Accroches personnalisées (écoles de musique déjà identifiées)
const ACCROCHES = {

function parseCSV(txt){
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<txt.length;i++){
    const ch=txt[i];
    if (q){
      if (ch==='"'){ if (txt[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else {
      if (ch==='"') q=true;
      else if (ch===','){ row.push(cur); cur=""; }
      else if (ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if (ch!=='\r') cur+=ch;
    }
  }
  if (cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

const RE_MAIL = /[^\s@,;:<>()«»"']+@[^\s@,;:<>()«»"']+\.[a-z]{2,}/gi;
const RE_SITE = /(?:https?:\/\/)?(?:[a-z0-9-]+\.)+(?:ch|com|de|fr|co|net|org|art|online|eu|it)(?:\/[^\s)]*)?/i;

// Une cellule peut contenir plusieurs adresses (retours à la ligne, virgules…)
// mêlées à du texte libre : on sépare les adresses du reste.
function decouper(s){
  s = (s||"").replace(/\r/g,"");
  const mails = (s.match(RE_MAIL)||[]).map(m=>m.replace(/\.$/,""));
  const reste = s.replace(RE_MAIL,"").replace(/^[\s,;\/–-]+|[\s,;\/–-]+$/g,"").trim();
  return {mails, reste};
}

// « =+41 79… » (saisi pour éviter une formule), « 41 33… » sans « + »,
// ou une erreur de formule (#ERROR!) : on rend un numéro exploitable.
function telephone(s){
  s = (s||"").trim().replace(/^'/,"");
  if (/^#/.test(s)) return "";
  s = s.replace(/^=\s*/,"");
  if (/^(41|33|39|44|49)\s/.test(s)) s = "+" + s;
  return s;
}

function parse(csv){
  const rows = parseCSV(csv);
  let head=-1;
  for (let i=0;i<rows.length;i++)
    if (rows[i].some(x=>norm(x)==="nom")){ head=i; break; }
  if (head<0) return [];
  const cols = rows[head].map(norm);
  // Colonnes repérées par leur nom, avec la position A…H en secours. Les deux
  // colonnes « État » (F et G) portaient le même nom : seule la première (F) fait foi.
  const pos = (n, p) => { const i = cols.indexOf(n); return i>=0 ? i : p; };
  const iNom=pos("nom",0), iTel=pos("numero",1), iMail=pos("mail",2),
        iMail2=pos("mail 2",3), iVille=pos("ville",4), iEtat=pos("etat",5),
        iCat=pos("categorie", 6),
        iRep=pos("reponse", cols[7] ? -1 : 7);
  const out=[];
  for (let i=head+1;i<rows.length;i++){
    const c=rows[i];
    const nom=(c[iNom]||"").trim();
    if (!nom) continue;
    const m1=decouper(c[iMail]), m2=decouper(c[iMail2]);
    const mails=[...new Set([...m1.mails,...m2.mails].map(m=>m.toLowerCase()))];
    out.push({ nom, ville:(c[iVille]||"").trim(),
      tel:telephone(c[iTel]),
      mail:mails[0]||"", autres:mails.slice(1),
      info:[m1.reste,m2.reste].filter(Boolean).join(" — "),
      etat:(c[iEtat]||"").trim(),
      catFeuille:(c[iCat]||"").trim(),
      // Chaque enregistrement CSV correspond à une ligne de la feuille (ligne i+1).
      celluleEtat:String.fromCharCode(65+iEtat) + (i+1),
      rep:iRep>=0 ? (c[iRep]||"").trim() : "" });
  }
  return out;
}

const siteDe = c => { const s=c.info.match(RE_SITE); return s ? (/^http/.test(s[0])?s[0]:"https://"+s[0]) : ""; };
const sansMail = c => "Aucune adresse dans la feuille : "
  + (c.contact ? "passer par la page de contact" : "à compléter")
  + (c.tel ? ", ou appeler au "+c.tel : "") + ".";

function prepare(r){
  const c = Object.assign({}, r);
  c.key = norm(c.nom);
  c.relance = ["Mail envoyé","Relancé","Pas de réponse"].indexOf(c.etat)>=0;
  const scolaire = norm(c.catFeuille) === "ecole scolaire";
  c.e = scolaire ? null : enrichir(c.nom);
  if (scolaire){
    const k = ECOLE_SCOLAIRE;
    c.cat = k.cat;
    c.obj = c.relance ? "Re : " + k.obj : k.obj;
    c.surligne = c.relance ? null : k.acc();
    c.texte = c.relance ? k.relance() : `${intro()}

${k.acc()}

${k.core()}

${SIG()}`;
    c.contact = siteDe(c);
    c.note = c.mail ? "Vérifie qu'il y a bien un piano dans l'établissement avant d'envoyer." : sansMail(c);
  } else if (c.e){
    c.cat = c.e.cat;
    c.obj = c.relance ? "Re : " + c.e.obj : c.e.obj;
    c.texte = c.relance ? RELANCE_PRESTIGE() : c.e.body(c.e);
    c.surligne = c.relance ? null : c.e.h;
    c.contact = siteDe(c) || c.e.contact || "";
    c.note = c.e.note || "";
    // Ces remarques décrivaient l'ancienne liste : la feuille fait foi désormais.
    c.note = c.note.replace(/(Pas d'adresse publiée[^.]*\.?|Téléphone uniquement(\.|, et)?)\s*/gi,"")
      .replace(/^[\s,.—:-]+|[\s,—-]+$/g,"").replace(/^./,ch=>ch.toUpperCase());
    if (!c.mail) c.note = sansMail(c) + (c.note?" "+c.note:"");
  } else if ((c.k = cible(c)) && !ACCROCHES[norm(c.nom)]){
    c.cat = c.k.cat;
    c.obj = c.relance ? "Re : " + c.k.obj : c.k.obj;
    c.surligne = c.relance ? null : c.k.acc();
    c.texte = c.relance ? c.k.relance() : `${intro()}

${c.k.acc()}

${c.k.core()}

${SIG()}`;
    c.contact = siteDe(c);
    c.note = NOTES[norm(c.nom)] || "";
    if (!c.mail) c.note = sansMail(c);
    else if (!c.relance) c.note = "Accroche type « " + c.k.cat + " » : relis la phrase surlignée avant d'envoyer.";
    if (/\((de|d|at)\)/i.test(c.ville)) c.note = (c.note?c.note+" ":"") + "Contact hors de Suisse : un message en allemand ou en anglais sera sans doute mieux reçu.";
  } else {
    c.cat = "École de musique";
    c.acc = accroche(c.nom, c.ville);
    c.obj = c.relance ? "Re : " + objet("") : objet(c.ville);
    c.texte = c.relance ? RELANCE_ECOLE() : corps(c);
    c.surligne = c.relance ? null : c.acc.t;
    c.contact = siteDe(c);
    c.note = NOTES[norm(c.nom)] || "";
    if (!c.mail) c.note = sansMail(c);
    else if (!c.acc.perso && !c.relance) c.note = "Nouvelle entrée : accroche générique. Personnalise la phrase surlignée avant d'envoyer.";
  }
  // La catégorie écrite dans la feuille fait foi pour le classement.
  if (c.catFeuille) c.cat = c.catFeuille;
  const ajout = t => { c.note = c.note ? c.note.replace(/([^.!?»])$/,"$1.") + " " + t : t; };
  if (c.info) ajout("Infos de ta feuille : « " + c.info + " »");
  if (c.rep && c.etat!=="Ne pas contacter") ajout("Note de ta feuille : « " + c.rep + " »");
  return c;
}

/* ═══════════════ Suivi local (jour, relances, « plus tard ») ═══════════════ */
const finDeJour = () => { const d=new Date(); d.setHours(23,59,59,999); return d.getTime(); };
function marquer(c, type){
  const l = LOG[c.key] || (LOG[c.key] = {ts:[]});
  l.ts.push(Date.now()); l.type = type; delete l.snooze; saveLog();
}
function reporter(c){
  (LOG[c.key] || (LOG[c.key] = {ts:[]})).snooze = finDeJour(); saveLog();
}
function suivi(c){
  const l = LOG[c.key];
  const last = l && l.ts && l.ts.length ? l.ts[l.ts.length-1] : 0;
  c.last = last;
  c.fait = !!last && jour(new Date(last)) === jour(new Date());
  c.reporte = !!(l && l.snooze && l.snooze > Date.now());
  c.jours = last ? Math.floor((Date.now()-last)/864e5) : null;
  c.aRelancer = c.etat === "Mail envoyé";
  c.relanceDue = c.aRelancer && (c.jours === null || c.jours >= cfg.relanceJ);
}

/* ═══════════════ Fiches ═══════════════ */
function copier(btn, txt, avant){
  btn.onclick = e => {
    e.stopPropagation();
    const lbl = btn.textContent;
    const fini = () => { btn.textContent="✓ Copié"; btn.classList.add('done');
      setTimeout(()=>{btn.textContent=lbl;btn.classList.remove('done')},1400); };
    const t = txt();
    if (avant) avant();
    if (navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(t).then(fini).catch(fb);
    else fb();
    function fb(){
      const ta=document.createElement('textarea'); ta.value=t;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy')}catch(_){}
      ta.remove(); fini();
    }
  };
}

const mailto = (adr, obj, txt) => "mailto:" + encodeURIComponent(adr)
  + "?subject=" + encodeURIComponent(obj) + "&body=" + encodeURIComponent(txt);

let toastTimer;
function toast(msg, label, fn){
  const t = $('toast');
  t.innerHTML = '<span>'+esc(msg)+'</span>' + (label?'<button>'+esc(label)+'</button>':'');
  t.hidden = false;
  if (label) t.querySelector('button').onclick = () => { t.hidden = true; fn && fn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 6000);
}
const ouvrirEtat = c => window.open(SHEET_URL+"#gid=0&range="+c.celluleEtat,"_blank");

// Contenu détaillé d'une fiche (partagé entre la liste et la session).
function corpsHTML(c){
  return `
    ${c.mail?`<div class="lab">Destinataire</div><div class="val">${esc(c.mail)}</div>`:``}
    ${c.autres.length?`<div class="lab">Autres adresses de la feuille</div>
      <div class="btns">${c.autres.map((a,i)=>`<button class="b-alt" data-i="${i}">✉ ${esc(a)}</button>`).join("")}</div>`:``}
    ${c.tel?`<div class="lab">Téléphone</div><div class="val"><a href="tel:${esc(c.tel.replace(/\s/g,''))}">${esc(c.tel)}</a></div>`:``}
    <div class="lab">Objet</div><div class="val">${esc(c.obj)}</div>
    <div class="lab">Message : touche le texte pour le modifier</div>
    <pre class="txt" contenteditable="true" spellcheck="true"></pre>
    ${c.note?`<div class="flag">${esc(c.note)}</div>`:``}
    <div class="btns">
      ${c.mail?`<button class="primary b-open">✉ Ouvrir dans l'app mail</button>
      <button class="b-body">Copier le mail</button>
      <button class="b-adr">Copier l'adresse</button>`:``}
      ${c.tel&&!c.mail?`<button class="primary b-call">📞 Appeler</button>`:``}
      ${c.contact?`<button class="b-web">Page de contact ↗</button>`:``}
      ${c.celluleEtat?`<button class="b-etat">Mettre à jour l'état ↗</button>`:``}
      <button class="b-reset soft">Rétablir le texte</button>
    </div>`;
}

function brancher(root, c, apres){
  const pre = root.querySelector('pre');
  const rendu = () => {
    let h = esc(c.texte);
    if (c.surligne) h = h.replace(esc(c.surligne), '<mark>'+esc(c.surligne)+'</mark>');
    pre.innerHTML = h;
  };
  rendu();
  const note = (type) => {
    marquer(c, type);
    toast("C'est noté dans ton suivi. Pense à passer l'état à « " + (c.relance?"Relancé":"Mail envoyé") + " » dans la feuille.",
          "Ouvrir la cellule", () => ouvrirEtat(c));
    if (apres) apres();
  };
  root.querySelector('.b-reset').onclick = e => { e.stopPropagation(); rendu(); };
  if (c.mail){
    copier(root.querySelector('.b-body'), ()=>pre.innerText, ()=>note("copie"));
    copier(root.querySelector('.b-adr'), ()=>c.mail);
    root.querySelector('.b-open').onclick = e => {
      e.stopPropagation();
      note("mail");
      window.location.href = mailto(c.mail, c.obj, pre.innerText);
    };
  }
  const call = root.querySelector('.b-call');
  if (call) call.onclick = e => { e.stopPropagation(); marquer(c,"appel");
    if (apres) apres(); window.location.href = "tel:" + c.tel.replace(/\s/g,""); };
  root.querySelectorAll('.b-alt').forEach(b => b.onclick = e => {
    e.stopPropagation();
    note("mail");
    window.location.href = mailto(c.autres[+b.dataset.i], c.obj, pre.innerText);
  });
  const web = root.querySelector('.b-web');
  if (web) web.onclick = e => { e.stopPropagation(); window.open(c.contact,"_blank"); };
  const et = root.querySelector('.b-etat');
  if (et) et.onclick = e => { e.stopPropagation(); ouvrirEtat(c); };
}

function badges(c){
  const b = [];
  if (c.fait) b.push('<span class="badge ok">✓ Préparé aujourd\'hui</span>');
  else if (c.reporte) b.push('<span class="badge">Plus tard</span>');
  if (c.aRelancer && c.jours!==null) b.push('<span class="badge '+(c.relanceDue?'warn':'')+'">J+'+c.jours+'</span>');
  else if (c.aRelancer) b.push('<span class="badge warn">À relancer</span>');
  return b.join("");
}

function fiche(c){
  const fg = couleur(c.etat);
  const el = document.createElement('div');
  el.className='card';
  el.style.setProperty('--st', fg);
  const meta = (c.cat?c.cat+" · ":"") + (c.ville||"—")
    + (c.mail?" · "+c.mail:(c.tel?" · "+c.tel:" · pas d'e-mail"));
  el.innerHTML = `
    <div class="head">
      <div class="who"><div class="nm">${esc(c.nom)}</div><div class="mt">${esc(meta)}</div></div>
      ${badges(c)}
      <div class="pill" style="color:${fg};background:${fg}22">${esc(c.etat||"—")}</div>
      <div class="chev">▶</div>
    </div>
    <div class="body">${corpsHTML(c)}
      <div class="btns"><button class="b-later soft">${c.reporte?"Remettre dans la file":"Plus tard"}</button></div>
    </div>`;
  el.querySelector('.head').onclick = () => el.classList.toggle('open');
  el.querySelector('.b-later').onclick = e => { e.stopPropagation();
    if (c.reporte){ delete LOG[c.key].snooze; saveLog(); } else reporter(c);
    rafraichir(); };
  brancher(el, c, () => { rafraichir(false); });
  return el;
}

/* ═══════════════ Vue liste / relances ═══════════════ */
let RAW=[], TOUS=[], vue="liste", catSel="";

function base(){
  if (vue==="relances") return TOUS.filter(c=>c.aRelancer);
  return TOUS.filter(c => cfg.filtre==="all" || (c.etat!=="Ne pas contacter" && c.etat!=="RDV"));
}

function puces(){
  const box=$('cats');
  const b = base();
  const n={}; b.forEach(c=>{ const k=c.cat||""; n[k]=(n[k]||0)+1; });
  const cats=Object.keys(n).sort((a,b)=>rangCat(a)-rangCat(b)||a.localeCompare(b,"fr"));
  if (catSel && !((catSel==="__aucune"?"":catSel) in n)) catSel="";
  const mk=(k,l,nb)=>`<button class="chip${catSel===k?' on':''}" data-k="${esc(k)}">${esc(l)}<small>${nb}</small></button>`;
  box.innerHTML = mk("","Toutes",b.length) + cats.map(k=>mk(k||"__aucune",k||"Sans catégorie",n[k])).join("");
  box.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{ catSel=x.dataset.k; afficher(); });
}

function afficher(){
  puces();
  const out = $('out');
  out.innerHTML="";
  // Une recherche porte sur tous les contacts, quel que soit le filtre d'état.
  const q = norm($('q').value);
  const vue_ = TOUS.filter(c => (!catSel || (c.cat||"")===(catSel==="__aucune"?"":catSel)) && (q
    ? norm([c.nom,c.ville,c.mail,c.autres.join(" "),c.cat,c.etat].join(" ")).includes(q)
    : base().indexOf(c)>=0));
  if (!vue_.length){
    out.innerHTML='<div class="msg">'+(q?"Aucun contact ne correspond à la recherche."
      : vue==="relances"?"Rien à relancer pour l'instant.":"Rien à afficher.")+'</div>';
    return;
  }
  const sect = (titre, grp) => {
    if (!grp.length) return;
    const h=document.createElement('div');
    h.className='sec'; h.innerHTML=esc(titre)+' <b>'+grp.length+'</b>';
    out.appendChild(h);
    grp.forEach(c => out.appendChild(fiche(c)));
  };
  if (vue==="relances" && !q){
    const tri = (a,b) => (b.jours===null?1e9:b.jours) - (a.jours===null?1e9:a.jours);
    sect("À relancer maintenant (J+"+cfg.relanceJ+" ou plus, ou date inconnue)", vue_.filter(c=>c.relanceDue).sort(tri));
    sect("Trop tôt pour relancer", vue_.filter(c=>!c.relanceDue).sort(tri));
  } else if (cfg.groupe==="cat"){
    // Par catégorie ; dans chaque catégorie, les contacts à traiter d'abord.
    const cats=[...new Set(vue_.map(c=>c.cat||""))].sort((a,b)=>rangCat(a)-rangCat(b)||a.localeCompare(b,"fr"));
    cats.forEach(k => sect(k||"Sans catégorie",
      vue_.filter(c=>(c.cat||"")===k).sort((a,b)=>rangEtat(a.etat)-rangEtat(b.etat))));
  } else {
    const groupes=[...ORDRE_ETAT, ...new Set(vue_.map(c=>c.etat||"").filter(e=>ORDRE_ETAT.indexOf(e)<0))];
    groupes.forEach(et => sect(et||"Sans état", vue_.filter(c=>(c.etat||"")===et)));
  }
}

/* ═══════════════ Tableau de bord ═══════════════ */
function tableau(){
  const n={}; TOUS.forEach(c=>{ const k=c.etat||"Sans état"; n[k]=(n[k]||0)+1; });
  const aTraiter = TOUS.filter(c=>c.etat==="À contacter").length;
  const relances = TOUS.filter(c=>c.relanceDue).length;
  const aujourdhui = TOUS.filter(c=>c.fait).length;
  const pct = Math.min(1, aujourdhui / Math.max(1,cfg.objectif));
  const C = 2*Math.PI*26;
  $('dash').innerHTML = `
    <div class="tile goal">
      <div class="ring${pct>=1?' full':''}"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26" fill="none" stroke-width="7"/>
        <circle class="fg" cx="32" cy="32" r="26" fill="none" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${(pct*C).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${aujourdhui}</b></div>
      <div><div class="k">Aujourd'hui</div><div class="n" style="font-size:14px;color:var(--ink);font-weight:600">
        ${aujourdhui} / ${cfg.objectif} mails</div>
        <div class="n">${pct>=1?"Objectif atteint 🎉":"encore "+(cfg.objectif-aujourdhui)+" pour l'objectif"}</div></div>
    </div>
    <button class="tile click${vue==="liste"?' on':''}" data-go="todo"><div class="k">À contacter</div><div class="v">${aTraiter}</div><div class="n">jamais écrit</div></button>
    <button class="tile click${vue==="relances"?' on':''}" data-go="relances"><div class="k">À relancer</div><div class="v">${relances}</div><div class="n">après J+${cfg.relanceJ}</div></button>
    <div class="tile"><div class="k">RDV</div><div class="v">${n["RDV"]||0}</div><div class="n">${TOUS.length} contacts au total</div></div>`;
  $('dash').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    changerVue(b.dataset.go==="relances"?"relances":"liste");
    if (b.dataset.go==="todo"){ cfg.filtre="todo"; saveCfg(); majBoutons(); afficher(); }
  });
  const keys = ORDRE_ETAT.filter(k=>n[k]).concat(Object.keys(n).filter(k=>ORDRE_ETAT.indexOf(k)<0));
  const pipe = $('pipe'); pipe.hidden = !TOUS.length;
  pipe.innerHTML = `<div class="bar">${keys.map(k=>`<i style="width:${(n[k]/TOUS.length*100).toFixed(2)}%;background:${couleur(k==="Sans état"?"":k)}" title="${esc(k)} : ${n[k]}"></i>`).join("")}</div>
    <div class="legend">${keys.map(k=>`<span><em style="background:${couleur(k==="Sans état"?"":k)}"></em>${esc(k)} <b>${n[k]}</b></span>`).join("")}</div>`;
}

/* ═══════════════ Session de prospection ═══════════════ */
let S = null;
function fileSession(){
  return TOUS.filter(c =>
      (c.etat==="À contacter" || c.etat==="")
      && !c.fait && !c.reporte
      && cfg.catsOff.indexOf(c.cat||"")<0
      && (!catSel || (c.cat||"")===(catSel==="__aucune"?"":catSel))
      && (c.mail || cfg.sansMail))
    .sort((a,b)=>rangCat(a.cat)-rangCat(b.cat) || (b.mail?1:0)-(a.mail?1:0));
}
function majCTA(){
  const n = fileSession().length;
  const b = $('b-session');
  b.disabled = !n;
  b.innerHTML = n ? `▶ Lancer une session<small>${n} contact${n>1?"s":""} à écrire</small>` : "Plus rien à écrire pour l'instant";
}
function ouvrirSession(){
  const liste = fileSession();
  if (!liste.length) return;
  S = { liste, i:0, fait:0, ok:false };
  $('sess').hidden = false; document.body.style.overflow = "hidden";
  rendreSession();
}
function fermerSession(){
  S = null; $('sess').hidden = true; document.body.style.overflow = "";
  rafraichir();
}
function rendreSession(){
  const box = $('sess');
  if (S.i >= S.liste.length){
    box.innerHTML = `<div class="sess-top"><button class="icon" data-x>✕</button><div class="prog"><div class="bar"><i style="width:100%"></i></div><span>Terminé</span></div></div>
      <div class="sess-main"><div class="end"><div class="big">🎹</div><h2>Session terminée</h2>
      <p style="color:var(--muted)">${S.fait} contact${S.fait>1?"s":""} préparé${S.fait>1?"s":""} sur cette session.<br>N'oublie pas de passer leur état à « Mail envoyé » dans la feuille.</p></div></div>
      <div class="sess-bar"><button class="go" data-x>Fermer</button><button data-sheet>Ouvrir la feuille ↗</button></div>`;
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=fermerSession);
    box.querySelector('[data-sheet]').onclick=()=>window.open(SHEET_URL,"_blank");
    return;
  }
  const c = S.liste[S.i];
  S.ok = false;
  const fg = couleur(c.etat);
  box.innerHTML = `
    <div class="sess-top"><button class="icon" data-x aria-label="Fermer">✕</button>
      <div class="prog"><div class="bar"><i style="width:${(S.i/S.liste.length*100).toFixed(1)}%"></i></div>
      <span>${S.i+1} / ${S.liste.length} · ${S.fait} préparé${S.fait>1?"s":""}</span></div></div>
    <div class="sess-main">
      <div class="sess-cat">${esc(c.cat||"Sans catégorie")}${c.ville?" · "+esc(c.ville):""}</div>
      <h2>${esc(c.nom)}</h2>
      <div class="sess-row"><span class="pill" style="display:inline-block;color:${fg};background:${fg}22">${esc(c.etat||"—")}</span>${badges(c)}</div>
      <div class="sess-corps">${corpsHTML(c)}</div>
    </div>
    <div class="sess-bar"><button data-prev ${S.i?"":"disabled"}>←</button><button data-later>Plus tard</button><button class="go" data-next>Passer →</button></div>`;
  box.querySelector('[data-x]').onclick = fermerSession;
  const suivant = () => { S.i++; rendreSession(); };
  box.querySelector('[data-next]').onclick = suivant;
  box.querySelector('[data-prev]').onclick = () => { if (S.i){ S.i--; rendreSession(); } };
  box.querySelector('[data-later]').onclick = () => { reporter(c); suivant(); };
  brancher(box.querySelector('.sess-corps'), c, () => {
    if (!S.ok){ S.ok = true; S.fait++; }
    const n = box.querySelector('[data-next]'); n.textContent = "Suivant →";
    box.querySelector('.prog span').textContent = (S.i+1)+" / "+S.liste.length+" · "+S.fait+" préparé"+(S.fait>1?"s":"");
  });
  box.querySelector('.sess-main').scrollTop = 0;
}
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (!$('cfg').hidden && e.key==="Escape"){ $('cfg').hidden = true; return; }
  if (!S) return;
  if (e.key==="Escape") fermerSession();
  else if (e.key==="ArrowRight"){ const b=$('sess').querySelector('[data-next]'); b && b.click(); }
  else if (e.key==="ArrowLeft"){ const b=$('sess').querySelector('[data-prev]'); b && !b.disabled && b.click(); }
});

/* ═══════════════ Réglages ═══════════════ */
function ouvrirReglages(){
  const box = $('cfg');
  const cats = [...new Set(RAW.map(r=>r.catFeuille).filter(Boolean))].sort((a,b)=>rangCat(a)-rangCat(b));
  const sw = (id, label, sub, on) => `<label class="row"><span>${label}${sub?`<small>${sub}</small>`:""}</span>
    <span class="sw"><input type="checkbox" id="${id}" ${on?"checked":""}><i></i></span></label>`;
  box.innerHTML = `<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Réglages</h2><button class="icon" id="c-x" aria-label="Fermer">✕</button></div>
    <p class="sub">Enregistrés sur cet appareil, appliqués tout de suite.</p>

    <div class="group"><div class="gt">Mes mails</div>
      <label class="field"><span>Mon nom (dans la présentation)</span><input id="c-nom" value="${esc(cfg.nom)}"></label>
      <label class="field"><span>Mon numéro (en fin de mail)</span><input id="c-tel" value="${esc(cfg.tel)}" inputmode="tel"></label>
      <label class="field"><span>Formule de fin (ta signature automatique prend le relais)</span><input id="c-fin" value="${esc(cfg.fin)}"></label>
    </div>

    <div class="group"><div class="gt">Rythme</div>
      <label class="field"><span>Objectif de mails par jour</span><input id="c-obj" type="number" min="1" max="100" value="${cfg.objectif}" inputmode="numeric"></label>
      <label class="field"><span>Relancer au bout de (jours)</span><input id="c-rel" type="number" min="1" max="60" value="${cfg.relanceJ}" inputmode="numeric"></label>
    </div>

    <div class="group"><div class="gt">Session de prospection</div>
      ${sw("c-sm","Inclure les contacts sans e-mail","Pour les appeler ou passer par leur page de contact",cfg.sansMail)}
      ${cats.length?`<div class="lab" style="margin-top:12px">Catégories incluses</div>`+cats.map((k,i)=>sw("c-cat"+i,esc(k),"",cfg.catsOff.indexOf(k)<0)).join(""):""}
    </div>

    <div class="group"><div class="gt">Affichage</div>
      <label class="field"><span>Thème</span><select id="c-th">
        <option value="auto">Automatique (suit l'appareil)</option><option value="dark">Sombre</option><option value="light">Clair</option></select></label>
      ${sw("c-rv","Afficher les revendeurs","Thomann, Kawai… masqués par défaut",cfg.revendeurs)}
    </div>

    <div class="group"><div class="gt">Suivi local</div>
      <button class="danger" id="c-reset">Remettre le suivi à zéro</button>
      <p class="sub" style="margin-top:8px">Efface les mails préparés et les « plus tard » de cet appareil. La feuille n'est pas touchée.</p>
    </div></div>`;
  box.hidden = false;
  box.onclick = e => { if (e.target===box) box.hidden = true; };
  $('c-x').onclick = () => { box.hidden = true; };
  $('c-th').value = cfg.theme;
  const maj = () => { saveCfg(); montrer(); };
  $('c-nom').oninput = e => { cfg.nom = e.target.value.trim() || DEFAUT.nom; maj(); };
  $('c-tel').oninput = e => { cfg.tel = e.target.value.trim() || DEFAUT.tel; maj(); };
  $('c-fin').oninput = e => { cfg.fin = e.target.value.trim() || DEFAUT.fin; maj(); };
  $('c-obj').onchange = e => { cfg.objectif = Math.max(1, +e.target.value||DEFAUT.objectif); maj(); };
  $('c-rel').onchange = e => { cfg.relanceJ = Math.max(1, +e.target.value||DEFAUT.relanceJ); maj(); };
  $('c-sm').onchange = e => { cfg.sansMail = e.target.checked; maj(); };
  $('c-rv').onchange = e => { cfg.revendeurs = e.target.checked; maj(); };
  $('c-th').onchange = e => { cfg.theme = e.target.value; appliquerTheme(); saveCfg(); };
  cats.forEach((k,i) => $('c-cat'+i).onchange = e => {
    cfg.catsOff = cfg.catsOff.filter(x=>x!==k); if (!e.target.checked) cfg.catsOff.push(k); maj(); });
  let t;
  $('c-reset').onclick = e => {
    if (!e.target.dataset.sur){ e.target.dataset.sur=1; e.target.textContent="Touche encore pour confirmer";
      t=setTimeout(()=>{ e.target.dataset.sur=""; e.target.textContent="Remettre le suivi à zéro"; },4000); return; }
    clearTimeout(t); LOG = {}; saveLog(); e.target.dataset.sur=""; e.target.textContent="C'est fait ✓"; rafraichir(); };
}

/* ═══════════════ Chargement ═══════════════ */
function rafraichir(liste=true){
  TOUS.forEach(suivi); tableau(); majCTA();
  if (liste) afficher(); else puces();
}
function montrer(csv){
  if (csv) RAW = parse(csv);
  if (!RAW.length) throw new Error("aucune ligne trouvée dans la feuille");
  TOUS = RAW.map(prepare).filter(c => cfg.revendeurs || !(c.k && c.k.masque));
  rafraichir();
}
function changerVue(v){
  vue = v;
  document.querySelectorAll('#seg-vue button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('seg-etat').style.display = v==="relances" ? "none" : "";
  catSel = ""; rafraichir();
}
function majBoutons(){
  $('f-todo').classList.toggle('on', cfg.filtre==="todo");
  $('f-all').classList.toggle('on', cfg.filtre==="all");
  $('f-group').textContent = "Classé par : " + (cfg.groupe==="cat" ? "catégorie" : "état");
}

async function lire(){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 15000);
  try{
    const r = await fetch(CSV_URL+"&_="+Date.now(), {cache:"no-store", signal:ctl.signal});
    if (r.status===401||r.status===403) throw new Error("accès refusé par Google : partage à vérifier");
    if (r.status===404) throw new Error("feuille introuvable");
    if (!r.ok) throw new Error("erreur Google (HTTP "+r.status+")");
    const csv = await r.text();
    if (/^\s*</.test(csv)) throw new Error("accès refusé par Google : partage à vérifier");
    return csv;
  }catch(e){
    if (e.name==="AbortError") throw new Error("Google ne répond pas (délai dépassé)");
    // Safari : « Load failed », Chrome : « Failed to fetch » — la requête n'a pas
    // abouti (réseau coupé, bloqueur, ou feuille non partagée → redirection vers la connexion).
    if (e instanceof TypeError) throw new Error("connexion à Google impossible (réseau, bloqueur de contenu ou partage de la feuille)");
    throw e;
  }finally{ clearTimeout(t); }
}

async function charger(){
  const out=$('out'), horo=$('horo'), btn=$('b-refresh');
  btn.classList.add('spin');
  if (!TOUS.length) out.innerHTML='<div class="msg">Lecture de la feuille…</div>';
  try{
    let csv;
    try{ csv = await lire(); }
    catch(_){ await new Promise(r=>setTimeout(r,1500)); csv = await lire(); }
    montrer(csv);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), csv})); }catch(_){}
    horo.innerHTML = '<span class="live"></span>Feuille lue à ' + heure(new Date()) + ' · ' + TOUS.length + ' contacts';
  }catch(e){
    let cache=null;
    try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(_){}
    if (cache && cache.csv){
      try{
        montrer(cache.csv);
        const d = new Date(cache.t);
        horo.innerHTML = '<span class="live stale"></span>Hors ligne : dernière lecture du ' + d.toLocaleDateString('fr-CH') + ' à ' + heure(d);
        toast("Lecture impossible (" + e.message + "). Les états ont peut-être changé.", "Réessayer", charger);
        return;
      }catch(_){}
    }
    $('dash').innerHTML=""; $('pipe').hidden=true; majCTA();
    out.innerHTML = `<div class="err">
      <b>Impossible de lire la feuille.</b> (${esc(e.message)})<br>
      Vérifie d'abord la connexion, puis touche <b>↻</b> en haut à droite.
      Si le problème persiste, la feuille doit être accessible en lecture par lien. Dans Google Sheets :
      <ol>
        <li>Bouton <b>Partager</b> en haut à droite</li>
        <li>Sous « Accès général », choisir <b>Tous les utilisateurs disposant du lien</b></li>
        <li>Rôle <b>Lecteur</b>, puis <b>Terminé</b></li>
        <li>Revenir ici et toucher <b>↻</b></li>
      </ol>
    </div>`;
    horo.innerHTML = '<span class="live stale"></span>Lecture impossible';
  }finally{ btn.classList.remove('spin'); }
}

/* ═══════════════ Démarrage ═══════════════ */
appliquerTheme();
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", appliquerTheme);
majBoutons();
$('b-refresh').onclick = charger;
$('b-sheet').onclick = () => window.open(SHEET_URL,"_blank");
$('b-cfg').onclick = ouvrirReglages;
$('b-session').onclick = ouvrirSession;
$('q').oninput = afficher;
document.querySelectorAll('#seg-vue button').forEach(b=>b.onclick=()=>changerVue(b.dataset.v));
$('f-todo').onclick = () => { cfg.filtre="todo"; saveCfg(); majBoutons(); afficher(); };
$('f-all').onclick  = () => { cfg.filtre="all";  saveCfg(); majBoutons(); afficher(); };
$('f-group').onclick = () => { cfg.groupe = cfg.groupe==="cat" ? "etat" : "cat"; saveCfg(); majBoutons(); afficher(); };

charger();
</script>
