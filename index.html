// Fiches rédigées à la main : seuls les textes (accroche, note, page de contact)
// servent encore. Nom, adresse, ville, téléphone et état viennent de la feuille.
const coreStr = s => norm(s).replace(/[^a-z0-9]/g,"");
const ENRICH = [
  ...HOTELS.map(c=>({...c, cat:"Hôtel",
    obj:"Accordeur et facteur de piano — à la disposition de votre établissement"+(c.v?" ("+c.v+")":""),
    body:bodyHotel})),
  ...CONCIERGES.map(c=>({...c, cat:"Conciergerie",
    obj:"Accordeur et facteur de piano — à votre disposition pour vos clients les plus exigeants",
    body:bodyConcierge})),
  ...BATEAUX.map(c=>({...c, cat:"Navigation",
    obj:c.customBody?"Technicien piano — candidature pour rejoindre votre réseau (région du Léman)"
                    :"Accordeur et facteur de piano — entretien du piano de vos bateaux et croisières",
    body:c.customBody?(()=>c.customBody):bodyBateau}))
].map(e=>({...e, key:coreStr(e.n)}));

function enrichir(nom){
  const cs = coreStr(nom);
  if (cs.length<4) return null;
  return ENRICH.find(e=>e.key===cs)
      || ENRICH.find(e=>e.key.length>=4 && (cs.includes(e.key)||e.key.includes(cs)))
      || null;
}

function parseCSV(txt){
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<txt.length;i++){
    const ch=txt[i];
    if (q){
      if (ch==='"'){ if (txt[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else {
      if (ch==='"') q=true;
      else if (ch===','){ row.push(cur); cur=""; }
      else if (ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if (ch!=='\r') cur+=ch;
    }
  }
  if (cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

const RE_MAIL = /[^\s@,;:<>()«»"']+@[^\s@,;:<>()«»"']+\.[a-z]{2,}/gi;
const RE_SITE = /(?:https?:\/\/)?(?:[a-z0-9-]+\.)+(?:ch|com|de|fr|co|net|org|art|online|eu|it)(?:\/[^\s)]*)?/i;

// Une cellule peut contenir plusieurs adresses (retours à la ligne, virgules…)
// mêlées à du texte libre : on sépare les adresses du reste.
function decouper(s){
  s = (s||"").replace(/\r/g,"");
  const mails = (s.match(RE_MAIL)||[]).map(m=>m.replace(/\.$/,""));
  const reste = s.replace(RE_MAIL,"").replace(/^[\s,;\/–-]+|[\s,;\/–-]+$/g,"").trim();
  return {mails, reste};
}

// « =+41 79… » (saisi pour éviter une formule), « 41 33… » sans « + »,
// ou une erreur de formule (#ERROR!) : on rend un numéro exploitable.
function telephone(s){
  s = (s||"").trim().replace(/^'/,"");
  if (/^#/.test(s)) return "";
  s = s.replace(/^=\s*/,"");
  if (/^(41|33|39|44|49)\s/.test(s)) s = "+" + s;
  return s;
}

function parse(csv){
  const rows = parseCSV(csv);
  let head=-1;
  for (let i=0;i<rows.length;i++)
    if (rows[i].some(x=>norm(x)==="nom")){ head=i; break; }
  if (head<0) return [];
  const cols = rows[head].map(norm);
  // Colonnes repérées par leur nom, avec la position A…H en secours. Les deux
  // colonnes « État » (F et G) portent le même nom : seule la première (F) fait foi.
  const pos = (n, p) => { const i = cols.indexOf(n); return i>=0 ? i : p; };
  const iNom=pos("nom",0), iTel=pos("numero",1), iMail=pos("mail",2),
        iMail2=pos("mail 2",3), iVille=pos("ville",4), iEtat=pos("etat",5),
        iRep=pos("reponse", cols[7] ? -1 : 7);
  const out=[];
  for (let i=head+1;i<rows.length;i++){
    const c=rows[i];
    const nom=(c[iNom]||"").trim();
    if (!nom) continue;
    const m1=decouper(c[iMail]), m2=decouper(c[iMail2]);
    const mails=[...new Set([...m1.mails,...m2.mails].map(m=>m.toLowerCase()))];
    out.push({ nom, ville:(c[iVille]||"").trim(),
      tel:telephone(c[iTel]),
      mail:mails[0]||"", autres:mails.slice(1),
      info:[m1.reste,m2.reste].filter(Boolean).join(" — "),
      etat:(c[iEtat]||"").trim(),
      rep:iRep>=0 ? (c[iRep]||"").trim() : "" });
  }
  return out;
}

function prepare(r){
  const c = Object.assign({}, r);
  c.relance = ["Mail envoyé","Relancé","Pas de réponse"].indexOf(c.etat)>=0;
  const site = c.info.match(RE_SITE);
  c.e = enrichir(c.nom);
  if (c.e){
    c.cat = c.e.cat;
    c.obj = c.relance ? "Re : " + c.e.obj : c.e.obj;
    c.texte = c.relance ? RELANCE_PRESTIGE : c.e.body(c.e);
    c.surligne = c.relance ? null : c.e.h;
    c.contact = site ? (/^http/.test(site[0])?site[0]:"https://"+site[0]) : (c.e.contact||"");
    c.note = c.e.note || "";
    // Ces remarques décrivaient l'ancienne liste : la feuille fait foi désormais.
    c.note = c.note.replace(/(Pas d'adresse publiée[^.]*\.?|Téléphone uniquement(\.|, et)?)\s*/gi,"")
      .replace(/^[\s,.—-]+|[\s,—-]+$/g,"").replace(/^./,ch=>ch.toUpperCase());
    if (!c.mail) c.note = "Aucune adresse dans la feuille — " + (c.contact?"passer par la page de contact":"à compléter") + (c.tel?", ou appeler au "+c.tel:"") + "." + (c.note?" "+c.note:"");
  } else if ((c.k = cible(c)) && !ACCROCHES[norm(c.nom)]){
    c.cat = c.k.cat;
    c.obj = c.relance ? "Re : " + c.k.obj : c.k.obj;
    c.texte = c.relance ? relanceCible(c.k.relance) : `Bonjour,

Je m'appelle Arnaud Cormary, je suis accordeur et facteur de piano à l'Atelier Piano Léman.

${c.k.acc}

${c.k.core}

${SIG}`;
    c.surligne = c.relance ? null : c.k.acc;
    c.contact = site ? (/^http/.test(site[0])?site[0]:"https://"+site[0]) : "";
    c.note = NOTES[norm(c.nom)] || "";
    if (!c.mail) c.note = "Aucune adresse dans la feuille — à compléter" + (c.tel?", ou à appeler au "+c.tel:"") + ".";
    else if (!c.relance) c.note = "Accroche type « " + c.k.cat + " » : relisez la phrase surlignée avant d'envoyer.";
    if (/\((de|d|at)\)/i.test(c.ville)) c.note = (c.note?c.note+" ":"") + "Contact hors de Suisse : un message en allemand ou en anglais sera sans doute mieux reçu.";
  } else {
    c.cat = "";
    c.acc = accroche(c.nom, c.ville);
    c.obj = objet(c.etat, c.ville);
    c.texte = corps(c);
    c.surligne = c.relance ? null : c.acc.t;
    c.contact = site ? (/^http/.test(site[0])?site[0]:"https://"+site[0]) : "";
    c.note = NOTES[norm(c.nom)] || "";
    if (!c.mail) c.note = "Aucune adresse dans la feuille — à compléter" + (c.tel?", ou à appeler au "+c.tel:"") + ".";
    else if (!c.acc.perso && !c.relance) c.note = "Nouvelle entrée : accroche générique. Personnalisez la phrase surlignée avant d'envoyer.";
  }
  const ajout = t => { c.note = c.note ? c.note.replace(/([^.!?»])$/,"$1.") + " " + t : t; };
  if (c.info) ajout("Infos de votre feuille : « " + c.info + " »");
  if (c.rep && c.etat!=="Ne pas contacter") ajout("Note de votre feuille : « " + c.rep + " »");
  return c;
}

function copier(btn, txt){
  btn.onclick = e => {
    e.stopPropagation();
    const lbl = btn.textContent;
    const fini = () => { btn.textContent="✓ Copié"; btn.classList.add('done');
      setTimeout(()=>{btn.textContent=lbl;btn.classList.remove('done')},1400); };
    const t = txt();
    if (navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(t).then(fini).catch(fb);
    else fb();
    function fb(){
      const ta=document.createElement('textarea'); ta.value=t;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy')}catch(_){}
      ta.remove(); fini();
    }
  };
}

const mailto = (adr, obj, txt) => "mailto:" + encodeURIComponent(adr)
  + "?subject=" + encodeURIComponent(obj) + "&body=" + encodeURIComponent(txt);

function fiche(o){
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = `
    <div class="head">
      <div class="dot" style="background:${o.fg}"></div>
      <div class="who"><div class="nm">${esc(o.nom)}</div>
        <div class="mt">${esc(o.meta)}</div></div>
      <div class="tag" style="color:${o.fg};background:${o.bg}">${esc(o.etat)}</div>
      <div class="chev">▶</div>
    </div>
    <div class="body">
      ${o.mail?`<div class="lab">Destinataire</div><div class="val">${esc(o.mail)}</div>`:``}
      ${o.autres.length?`<div class="lab">Autres adresses de la feuille</div>
        <div class="btns">${o.autres.map((a,i)=>`<button class="b-alt" data-i="${i}">✉ ${esc(a)}</button>`).join("")}</div>`:``}
      ${o.tel?`<div class="lab">Téléphone</div><div class="val"><a href="tel:${esc(o.tel.replace(/\s/g,''))}">${esc(o.tel)}</a></div>`:``}
      <div class="lab">Objet</div><div class="val">${esc(o.obj)}</div>
      <div class="lab">Message — touchez le texte pour le modifier</div>
      <pre class="txt" contenteditable="true" spellcheck="true"></pre>
      ${o.note?`<div class="flag">${esc(o.note)}</div>`:``}
      <div class="btns">
        ${o.mail?`<button class="primary b-open">✉ Ouvrir dans l'app mail</button>
        <button class="b-body">Copier le mail</button>
        <button class="b-adr">Copier l'adresse</button>`:``}
        ${o.contact?`<button class="b-web">Page de contact ↗</button>`:``}
        <button class="b-reset">Rétablir</button>
      </div>
    </div>`;
  const pre = el.querySelector('pre');
  const rendu = () => {
    let h = esc(o.texte);
    if (o.surligne) h = h.replace(esc(o.surligne), '<mark>'+esc(o.surligne)+'</mark>');
    pre.innerHTML = h;
  };
  rendu();
  el.querySelector('.b-reset').onclick = e => { e.stopPropagation(); rendu(); };
  el.querySelector('.head').onclick = () => el.classList.toggle('open');
  if (o.mail){
    copier(el.querySelector('.b-body'), ()=>pre.innerText);
    copier(el.querySelector('.b-adr'), ()=>o.mail);
    el.querySelector('.b-open').onclick = e => {
      e.stopPropagation();
      window.location.href = mailto(o.mail, o.obj, pre.innerText);
    };
  }
  el.querySelectorAll('.b-alt').forEach(b => b.onclick = e => {
    e.stopPropagation();
    window.location.href = mailto(o.autres[+b.dataset.i], o.obj, pre.innerText);
  });
  if (o.contact) el.querySelector('.b-web').onclick = e => {
    e.stopPropagation(); window.open(o.contact,"_blank"); };
  return el;
}

function carteFeuille(c){
  const [fg,bg] = COULEURS[c.etat] || COULEURS[""];
  return fiche({ nom:c.nom, etat:c.etat||"—", fg, bg,
    meta:(c.cat?c.cat+" · ":"") + (c.ville||"—")
      + (c.mail?" · "+c.mail:(c.tel?" · "+c.tel:" · pas d'e-mail")),
    mail:c.mail, autres:c.autres, tel:c.tel, contact:c.contact, obj:c.obj,
    texte:c.texte, surligne:c.surligne, note:c.note });
}

let TOUS=[], filtre="todo";

function afficher(){
  const out = document.getElementById('out');
  out.innerHTML="";
  const vis = TOUS.filter(c => filtre==="all" ? true
    : (c.etat!=="Ne pas contacter" && c.etat!=="RDV"));
  if (!vis.length){ out.innerHTML='<div class="msg">Rien à afficher.</div>'; return; }
  const ordre=["À contacter","Pas de réponse","Mail envoyé","Relancé","RDV","Ne pas contacter"];
  const groupes=[...ordre, ...new Set(vis.map(c=>c.etat||"").filter(e=>ordre.indexOf(e)<0))];
  groupes.forEach(et => {
    const grp = vis.filter(c => (c.etat||"")===et);
    if (!grp.length) return;
    const h=document.createElement('div');
    h.className='sec'; h.textContent=(et||"Sans état")+" — "+grp.length;
    out.appendChild(h);
    grp.forEach(c => out.appendChild(carteFeuille(c)));
  });
}

function stats(){
  const n={};
  TOUS.forEach(c=>{ const k=c.etat||"Sans état"; n[k]=(n[k]||0)+1; });
  const s=document.getElementById('stats');
  s.style.display='';
  s.innerHTML = Object.keys(n).map(k=>`<span><b>${n[k]}</b> ${esc(k.toLowerCase())}</span>`).join("")
    + `<span style="margin-left:auto"><b>${TOUS.length}</b> au total</span>`;
}

const heure = d => d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});

async function lire(){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 15000);
  try{
    const r = await fetch(CSV_URL+"&_="+Date.now(), {cache:"no-store", signal:ctl.signal});
    if (r.status===401||r.status===403) throw new Error("accès refusé par Google — partage à vérifier");
    if (r.status===404) throw new Error("feuille introuvable");
    if (!r.ok) throw new Error("erreur Google (HTTP "+r.status+")");
    const csv = await r.text();
    if (/^\s*</.test(csv)) throw new Error("accès refusé par Google — partage à vérifier");
    return csv;
  }catch(e){
    if (e.name==="AbortError") throw new Error("Google ne répond pas (délai dépassé)");
    // Safari : « Load failed », Chrome : « Failed to fetch » — la requête n'a pas
    // abouti (réseau coupé, bloqueur, ou feuille non partagée → redirection vers la connexion).
    if (e instanceof TypeError) throw new Error("connexion à Google impossible (réseau, bloqueur de contenu ou partage de la feuille)");
    throw e;
  }finally{ clearTimeout(t); }
}

function montrer(csv){
  TOUS = parse(csv).map(prepare);
  if (!TOUS.length) throw new Error("aucune ligne trouvée dans la feuille");
  stats(); afficher();
}

async function charger(){
  const out=document.getElementById('out'), horo=document.getElementById('horo');
  out.innerHTML='<div class="msg">Lecture de la feuille…</div>';
  horo.textContent="";
  try{
    let csv;
    try{ csv = await lire(); }
    catch(_){ await new Promise(r=>setTimeout(r,1500)); csv = await lire(); }
    montrer(csv);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), csv})); }catch(_){}
    horo.textContent = "Feuille lue à " + heure(new Date()) + " · " + TOUS.length + " contacts.";
  }catch(e){
    let cache=null;
    try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(_){}
    if (cache && cache.csv){
      try{
        montrer(cache.csv);
        const d = new Date(cache.t);
        horo.innerHTML = `<span style="color:var(--warn)">⚠ Lecture impossible (${esc(e.message)}). `
          + `Affichage de la dernière lecture, du ${d.toLocaleDateString('fr-CH')} à ${heure(d)} — les états peuvent avoir changé.</span>`;
        return;
      }catch(_){}
    }
    document.getElementById('stats').style.display='none';
    out.innerHTML = `<div class="err">
      <b>Impossible de lire la feuille.</b> (${esc(e.message)})<br>
      Vérifiez d'abord la connexion, puis touchez <b>↻ Actualiser</b>.
      Si le problème persiste, la feuille doit être accessible en lecture par lien. Dans Google Sheets :
      <ol>
        <li>Bouton <b>Partager</b> en haut à droite</li>
        <li>Sous « Accès général », choisir <b>Tous les utilisateurs disposant du lien</b></li>
        <li>Rôle <b>Lecteur</b>, puis <b>Terminé</b></li>
        <li>Revenir ici et toucher <b>↻ Actualiser</b></li>
      </ol>
    </div>`;
  }
}

document.getElementById('b-refresh').onclick = charger;
document.getElementById('b-sheet').onclick = () => window.open(SHEET_URL,"_blank");
document.getElementById('f-todo').onclick = () => { filtre="todo";
  document.getElementById('f-todo').classList.add('on');
  document.getElementById('f-all').classList.remove('on'); afficher(); };
document.getElementById('f-all').onclick = () => { filtre="all";
  document.getElementById('f-all').classList.add('on');
  document.getElementById('f-todo').classList.remove('on'); afficher(); };

charger();
