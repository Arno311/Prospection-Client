function parseCSV(txt){
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<txt.length;i++){
    const ch=txt[i];
    if (q){
      if (ch==='"'){ if (txt[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    } else {
      if (ch==='"') q=true;
      else if (ch===','){ row.push(cur); cur=""; }
      else if (ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if (ch!=='\r') cur+=ch;
    }
  }
  if (cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function parse(csv){
  const rows = parseCSV(csv);
  let head=-1;
  for (let i=0;i<rows.length;i++)
    if (rows[i].some(x=>norm(x)==="nom")){ head=i; break; }
  if (head<0) return [];
  const cols = rows[head].map(norm);
  const idx = n => cols.indexOf(n);
  const iNom=idx("nom"), iTel=idx("numero"), iMail=idx("mail"),
        iVille=idx("ville"), iEtat=idx("etat"), iRep=idx("reponse");
  const out=[];
  for (let i=head+1;i<rows.length;i++){
    const c=rows[i];
    const nom=(c[iNom]||"").trim();
    if (!nom) continue;
    out.push({ nom, ville:(c[iVille]||"").trim(),
      tel:(c[iTel]||"").replace(/^=\+?/,"+").trim(),
      mail:(c[iMail]||"").trim(), etat:(c[iEtat]||"").trim(),
      rep:(c[iRep]||"").trim() });
  }
  return out;
}

function prepare(r){
  const c = Object.assign({}, r);
  c.relance = ["Mail envoyé","Relancé","Pas de réponse"].indexOf(c.etat)>=0;
  c.acc = accroche(c.nom, c.ville);
  c.obj = objet(c.etat, c.ville);
  c.note = NOTES[norm(c.nom)] || "";
  if (!c.mail) c.note = "Aucune adresse dans la feuille — à compléter, ou à appeler" + (c.tel?" au "+c.tel:"") + ".";
  else if (!c.acc.perso && !c.relance) c.note = "Nouvelle entrée : accroche générique. Personnalisez la phrase surlignée avant d'envoyer.";
  if (c.rep && c.etat!=="Ne pas contacter") c.note = (c.note?c.note+" ":"") + "Note de votre feuille : « " + c.rep + " »";
  return c;
}

function copier(btn, txt){
  btn.onclick = e => {
    e.stopPropagation();
    const lbl = btn.textContent;
    const fini = () => { btn.textContent="✓ Copié"; btn.classList.add('done');
      setTimeout(()=>{btn.textContent=lbl;btn.classList.remove('done')},1400); };
    const t = txt();
    if (navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(t).then(fini).catch(fb);
    else fb();
    function fb(){
      const ta=document.createElement('textarea'); ta.value=t;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy')}catch(_){}
      ta.remove(); fini();
    }
  };
}

function fiche(o){
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = `
    <div class="head">
      <div class="dot" style="background:${o.fg}"></div>
      <div class="who"><div class="nm">${esc(o.nom)}</div>
        <div class="mt">${esc(o.meta)}</div></div>
      <div class="tag" style="color:${o.fg};background:${o.bg}">${esc(o.etat)}</div>
      <div class="chev">▶</div>
    </div>
    <div class="body">
      ${o.mail?`<div class="lab">Destinataire</div><div class="val">${esc(o.mail)}</div>`:``}
      ${o.tel?`<div class="lab">Téléphone</div><div class="val"><a href="tel:${esc(o.tel.replace(/\s/g,''))}">${esc(o.tel)}</a></div>`:``}
      <div class="lab">Objet</div><div class="val">${esc(o.obj)}</div>
      <div class="lab">Message — touchez le texte pour le modifier</div>
      <pre class="txt" contenteditable="true" spellcheck="true"></pre>
      ${o.note?`<div class="flag">${esc(o.note)}</div>`:``}
      <div class="btns">
        ${o.mail?`<button class="primary b-open">✉ Ouvrir dans l'app mail</button>
        <button class="b-body">Copier le mail</button>
        <button class="b-adr">Copier l'adresse</button>`:``}
        ${o.contact?`<button class="b-web">Page de contact ↗</button>`:``}
        <button class="b-reset">Rétablir</button>
      </div>
    </div>`;
  const pre = el.querySelector('pre');
  const rendu = () => {
    let h = esc(o.texte);
    if (o.surligne) h = h.replace(esc(o.surligne), '<mark>'+esc(o.surligne)+'</mark>');
    pre.innerHTML = h;
  };
  rendu();
  el.querySelector('.b-reset').onclick = e => { e.stopPropagation(); rendu(); };
  el.querySelector('.head').onclick = () => el.classList.toggle('open');
  if (o.mail){
    copier(el.querySelector('.b-body'), ()=>pre.innerText);
    copier(el.querySelector('.b-adr'), ()=>o.mail);
    el.querySelector('.b-open').onclick = e => {
      e.stopPropagation();
      window.location.href = "mailto:" + encodeURIComponent(o.mail)
        + "?subject=" + encodeURIComponent(o.obj)
        + "&body=" + encodeURIComponent(pre.innerText);
    };
  }
  if (o.contact) el.querySelector('.b-web').onclick = e => {
    e.stopPropagation(); window.open(o.contact,"_blank"); };
  return el;
}

function carteFeuille(c){
  const [fg,bg] = COULEURS[c.etat] || COULEURS[""];
  return fiche({ nom:c.nom, etat:c.etat||"—", fg, bg,
    meta:(c.ville||"—") + (c.mail?" · "+c.mail:" · pas d'e-mail"),
    mail:c.mail, tel:c.tel, obj:c.obj, texte:corps(c),
    surligne:c.relance?null:c.acc.t, note:c.note });
}
function carteManuelle(c, obj, texte, badge){
  return fiche({ nom:c.n, etat:badge, fg:"#8a5a2b", bg:"#f3ebe2",
    meta:(c.v||"—") + (c.e?" · "+c.e:(c.tel?" · "+c.tel:" · pas d'e-mail")),
    mail:c.e, tel:c.tel, contact:c.contact, obj, texte,
    surligne:c.h, note:c.note });
}

let TOUS=[], filtre="todo";

function afficher(){
  const out = document.getElementById('out');
  out.innerHTML="";
  const vis = TOUS.filter(c => filtre==="all" ? true
    : (c.etat!=="Ne pas contacter" && c.etat!=="RDV"));
  if (!vis.length){ out.innerHTML='<div class="msg">Rien à afficher.</div>'; return; }
  const ordre=["À contacter","Pas de réponse","Mail envoyé","Relancé","RDV","Ne pas contacter",""];
  ordre.forEach(et => {
    const grp = vis.filter(c => (c.etat||"")===et);
    if (!grp.length) return;
    const h=document.createElement('div');
    h.className='sec'; h.textContent=(et||"Sans état")+" — "+grp.length;
    out.appendChild(h);
    grp.forEach(c => out.appendChild(carteFeuille(c)));
  });
}

function stats(){
  const n={};
  TOUS.forEach(c=>{ const k=c.etat||"Sans état"; n[k]=(n[k]||0)+1; });
  const s=document.getElementById('stats');
  s.style.display='';
  s.innerHTML = Object.keys(n).map(k=>`<span><b>${n[k]}</b> ${esc(k.toLowerCase())}</span>`).join("")
    + `<span style="margin-left:auto"><b>${TOUS.length}</b> au total</span>`;
}

  const oh=document.getElementById('out-hotels'),

  HOTELS.forEach(c=>oh.appendChild(carteManuelle(c,
    "Accordeur et facteur de piano — à la disposition de votre établissement"+(c.v?" ("+c.v+")":""),
    bodyHotel(c),"Hôtel")));
  h=document.createElement('div'); h.className='sec';
  h.textContent="Conciergeries privées"; oc.appendChild(h);
  CONCIERGES.forEach(c=>oc.appendChild(carteManuelle(c,
    "Accordeur et facteur de piano — à votre disposition pour vos clients les plus exigeants",
    bodyConcierge(c),"Conciergerie")));
  h=document.createElement('div'); h.className='sec';
  h.textContent="Bateaux & croisières"; ob.appendChild(h);
  BATEAUX.forEach(c=>ob.appendChild(carteManuelle(c,
    c.customBody?"Technicien piano — candidature pour rejoindre votre réseau (région du Léman)"
                :"Accordeur et facteur de piano — entretien du piano de vos bateaux et croisières",
    c.customBody||bodyBateau(c),"Navigation")));
}

async function charger(){
  const out=document.getElementById('out'), horo=document.getElementById('horo');
  out.innerHTML='<div class="msg">Lecture de la feuille…</div>';
  try{
    const r = await fetch(CSV_URL+"&_="+Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP "+r.status);
    const csv = await r.text();
    if (/^\s*</.test(csv)) throw new Error("accès refusé");
    const coreStr = s => norm(s).replace(/[^a-z0-9]/g,"");
    const exclus = [...HOTELS,...CONCIERGES,...BATEAUX]
      .map(c=>coreStr(c.n)).filter(s=>s.length>=4);
    TOUS = parse(csv).map(prepare).filter(c=>{
      const cs=coreStr(c.nom);
      if (cs.length<4) return true;
      return !exclus.some(e=>cs.includes(e)||e.includes(cs));
    });
    if (!TOUS.length) throw new Error("aucune ligne trouvée");
    stats(); afficher();
    horo.textContent = "Feuille lue à " + new Date().toLocaleTimeString('fr-CH',
      {hour:'2-digit',minute:'2-digit'}) + " · " + TOUS.length + " contacts.";
  }catch(e){
    document.getElementById('stats').style.display='none';
    out.innerHTML = `<div class="err">
      <b>Impossible de lire la feuille.</b> (${esc(e.message)})<br>
      La feuille doit être accessible en lecture par lien. Dans Google Sheets :
      <ol>
        <li>Bouton <b>Partager</b> en haut à droite</li>
        <li>Sous « Accès général », choisir <b>Tous les utilisateurs disposant du lien</b></li>
        <li>Laisser le rôle sur <b>Lecteur</b>, puis <b>Terminé</b></li>
        <li>Revenir ici et toucher <b>↻ Actualiser</b></li>
      </ol>
      Les sections Hôtels, Conciergeries et Bateaux ci-dessous fonctionnent sans cela.
    </div>`;
    horo.textContent="";
  }
}

document.getElementById('b-refresh').onclick = charger;
document.getElementById('b-sheet').onclick = () => window.open(SHEET_URL,"_blank");
document.getElementById('f-todo').onclick = () => { filtre="todo";
  document.getElementById('f-todo').classList.add('on');
  document.getElementById('f-all').classList.remove('on'); afficher(); };
document.getElementById('f-all').onclick = () => { filtre="all";
  document.getElementById('f-all').classList.add('on');
  document.getElementById('f-todo').classList.remove('on'); afficher(); };

sections();
charger();
</script>
